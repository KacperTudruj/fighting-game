<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <!-- Tło dla kontrastu -->
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#151b2b"/>
            <stop offset="100%" stop-color="#07090f"/>
        </radialGradient>
        
        <!-- Niebieski, elektryczny gradient -->
        <linearGradient id="blueBolt" x1="30%" y1="0%" x2="70%" y2="100%">
            <stop offset="0%" stop-color="#80e5ff"/>
            <stop offset="50%" stop-color="#0099ff"/>
            <stop offset="100%" stop-color="#002b80"/>
        </linearGradient>

        <!-- Poświata pioruna -->
        <filter id="electricGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Zaokrąglone tło ikony -->
    <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#1a365d" stroke-width="2"/>

    <!-- Zewnętrzna poświata pioruna -->
    <polygon points="58,10 25,52 48,52 38,90 78,42 53,42" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linejoin="round" opacity="0.4" filter="url(#electricGlow)"/>

    <!-- Główny kształt pioruna -->
    <polygon points="58,10 25,52 48,52 38,90 78,42 53,42" fill="url(#blueBolt)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" filter="url(#electricGlow)"/>
</svg>
